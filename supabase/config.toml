# Config del progetto Supabase (usata da Supabase CLI e dalla GitHub integration).
# project_id è l'identificatore locale; collegando il repo, Supabase lo associa al
# tuo progetto remoto.
project_id = "carspot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17   # come il progetto remoto (Postgres 17)

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# L'auth utente è Clerk (third-party auth): Supabase accetta i JWT di Clerk e le RLS
# leggono l'utente da auth.jwt()->>'sub'. Supabase Auth nativa non si usa.
site_url = "carspot://"

[auth.third_party.clerk]
enabled = true
domain = "quiet-oarfish-3994.clerk.accounts.dev"   # Frontend API Clerk (istanza di sviluppo)

[storage]
enabled = true

# Edge Function di riconoscimento (proxy verso il provider, tiene la chiave server-side).
# verify_jwt = false perché l'app chiama con la publishable key (sb_publishable_...), che non
# è un JWT. La verifica dell'utente è nel codice: JWT Clerk (RS256 via JWKS, env CLERK_DOMAIN),
# più rate limit giornaliero per utente (public.consume_recognition_quota).
[functions.recognize]
enabled = true
verify_jwt = false

# Webhook Clerk → Supabase (user.created / user.deleted). Lo chiama Clerk, non l'app:
# niente JWT, la sicurezza è la firma Svix (secret CLERK_WEBHOOK_SIGNING_SECRET).
[functions.clerk-webhook]
enabled = true
verify_jwt = false
